<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Draconid Drift</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head><body>
<div id="app" data-view="home">

  <!-- the sky: one Aladin map, clipped and scaled by CSS when it squishes into the left panel -->
  <div id="sky-clip"><div id="sky-inner"><div id="sky"></div></div></div>
  <div id="blend"></div>
  <div id="hl" aria-hidden="true"></div>
  <div id="beacon" aria-hidden="true"></div>
  <div id="veil"></div>

  <header id="bar">
    <button id="brand" type="button">Draconid Drift</button>
    <nav>
      <button id="aboutBtn" type="button">About</button>
      <div id="search">
        <div id="sfield"><input id="q" type="text" placeholder="Search for an object" autocomplete="off" spellcheck="false" aria-label="Search for an object"></div>
        <button id="sbtn" type="button" aria-label="Search" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <circle class="lens" cx="10.5" cy="10.5" r="6.2"/><path class="handle" d="M15.2 15.2 20 20"/><path class="x1" d="M6 6 18 18"/><path class="x2" d="M18 6 6 18"/>
          </svg>
        </button>
        <ul id="results" role="listbox"></ul>
      </div>
    </nav>
  </header>

  <main id="page2">
    <section class="panel img" id="pWise"><canvas id="wiseCv"></canvas>
      <div class="lab"><h2>AllWISE</h2><p id="wiseCap">2010</p></div></section>
    <section class="panel img" id="pSpx"><canvas id="spxCv"></canvas>
      <div class="lab"><h2>SPHEREx</h2><p id="spxCap"></p></div>
      <div class="ctrl"><button id="play" type="button" aria-label="Pause"><svg viewBox="0 0 24 24" width="16" height="16"><g class="ip"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></g><path class="ia" d="M7 5v14l12-7z"/></svg></button>
        <div id="track"><div id="fill"></div><div id="thumb"></div></div></div></section>
    <aside class="panel" id="info">
      <div class="blk"><h3>What we are looking at</h3><div class="big" id="iName"></div></div>
      <div class="blk"><h3>Coords</h3><div class="coord" id="iCoord"></div></div>
      <div class="blk"><h3>More info</h3><div id="iVerdict"></div></div>
      <div class="blk grow"><h3>In the frame</h3><div class="empty" id="iObjs">Nothing here yet</div></div>
    </aside>
  </main>
  <footer id="foot"></footer>

  <section id="about" aria-hidden="true"></section>
  <div id="toast" role="status"></div>
</div>
<script type="module" src="app.js"></script>
</body></html>
